<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: var(--surface); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--surface); }
  .cover svg { position: absolute; inset: 0; }
  .cyan { fill: var(--brand-cyan); }
  .ink { fill: var(--ink); }
  .tint { fill: var(--rule-divider); }
  .dash { fill: var(--accent-dash); }
  .sq { rx: var(--radius-none); }
  .rule { stroke: var(--rule-hairline); stroke-width: var(--border-hairline); }
  .text { position: absolute; left: 41.33px; bottom: 36px; max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 92px; line-height: .95; letter-spacing: -0.01em; color: var(--ink); text-transform: none; }
  .tag { margin: 12px 0 0; font-family: var(--font-sans); font-weight: 500; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <rect class="cyan sq" x="480" y="0" width="480" height="192"/>
    <rect class="tint sq" x="480" y="192" width="264" height="48"/>
    <rect class="ink sq" x="744" y="192" width="216" height="96"/>
    <g class="dash">
      <rect class="sq" x="768" y="222" width="18" height="3"/>
      <rect class="sq" x="804" y="222" width="18" height="3"/>
      <rect class="sq" x="840" y="222" width="18" height="3"/>
      <rect class="sq" x="876" y="222" width="18" height="3"/>
      <rect class="sq" x="912" y="222" width="18" height="3"/>
      <rect class="sq" x="768" y="258" width="18" height="3"/>
      <rect class="sq" x="804" y="258" width="18" height="3"/>
      <rect class="sq" x="840" y="258" width="18" height="3"/>
      <rect class="sq" x="876" y="258" width="18" height="3"/>
      <rect class="sq" x="912" y="258" width="18" height="3"/>
    </g>
    <line class="rule" x1="480" y1="264" x2="744" y2="264"/>
  </svg>
  <div class="text">
    <h1 class="name">Stephen Gehring</h1>
    <p class="tag">Creativity that moves business.</p>
  </div>
</div>
</body>
</html>
